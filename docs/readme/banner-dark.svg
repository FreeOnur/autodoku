<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="AutoDoku – Du chillst, ich schreib mit.">
  <style>
    .b { fill: #7CF3C3; opacity: .85; transform-box: fill-box; transform-origin: center; animation: pulse 1s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: scaleY(.25); opacity: .45; } to { transform: scaleY(1); opacity: .95; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
