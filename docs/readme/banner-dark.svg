  <text class="t" x="72" y="196" font-size="40" font-weight="800" fill="#E7EFEB">Du chillst. <tspan fill="#7CF3C3">Ich schreib mit.</tspan><tspan class="cursor" fill="#7CF3C3">▍</tspan></text>
  <text class="t" x="72" y="244" font-size="21" fill="#8FA59C">Live-Mitschrift für die Schule · echte Word-Formeln · Tafelfotos · lokal oder mit Claude</text>
